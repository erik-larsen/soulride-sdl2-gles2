name: Deploy web build to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 4.0.12
          # Cache the installed emsdk toolchain across runs.
          actions-cache-folder: emsdk-cache

      - name: Cache Emscripten ports
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Built SDL2 / SDL2_mixer / vorbis / ogg ports live here;
          # caching them skips the first-build port compile.
          path: ${{ env.EMSDK }}/upstream/emscripten/cache
          key: emcache-4.0.12-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: emcache-4.0.12-

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web -j4

      - name: Stage site
        run: |
          mkdir -p _site
          cp build-web/soulride.html _site/index.html
          cp build-web/soulride.js build-web/soulride.wasm build-web/soulride.data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
